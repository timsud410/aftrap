# Draait iedere drie uur vanzelf. Jij hoeft hier nooit iets aan te doen.
#
# Wat er gebeurt:
#   1. GitHub start een verse Linux-machine
#   2. Haalt de nieuwste wedstrijddata op van football-data.co.uk
#   3. Fit het model en genereert de tips
#   4. Publiceert de pagina op je eigen adres
#
# Je hoeft je Mac niet aan te hebben staan.

name: Aftrap verversen

on:
  schedule:
    # Elke drie uur: actuele odds, blessures, opstellingen en uitslagen.
    - cron: "20 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installeer wat het model nodig heeft
        run: pip install -r requirements.txt

      - name: Controleer model- en selectielogica
        run: python -m unittest discover -v

      # De ruwe CSV's veranderen niet met terugwerkende kracht, dus we
      # bewaren ze tussen runs. Scheelt football-data.co.uk honderd
      # downloads per dag en maakt de run sneller.
      - name: Hergebruik eerder opgehaalde data
        uses: actions/cache@v4
        with:
          path: |
            data/aftrap.sqlite
            data/raw
            data/api_football
          key: aftrap-data-${{ github.run_id }}
          restore-keys: aftrap-data-

      - name: Haal data op en genereer de tips
        run: python build_site.py
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
